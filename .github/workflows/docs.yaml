name: Docs

on:
  push:
    branches:
      - main
    paths:
      - modules/**
      - hosts/**
      - lib/docs/**
      - users.nix
      - flake.nix
      - flake.lock
      - .github/workflows/docs.yaml
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.ref_name }}
      BRANCH: docs/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix run .#docs
      - name: Create or update PR
        run: |
          if [[ -z $(git status --porcelain docs/) ]]; then
            echo "docs/ is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/
          git commit -m "docs: regenerate"
          git push --force origin "$BRANCH"
          if [[ -z $(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number') ]]; then
            gh pr create --head "$BRANCH" --base "$BASE" \
              --title "docs: regenerate ($BASE)" \
              --body "Auto-generated by \`nix run .#docs\`. Triggered by ${{ github.event_name }} on \`$BASE\`."
          else
            echo "PR already open for $BRANCH -> $BASE; branch updated."
          fi
